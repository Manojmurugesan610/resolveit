<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ResolveIT — Smart IT Support</title>
<style>
:root{--bg:#f5f7fb;--c:#fff;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--a:#4f46e5;--s:#0f172a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1120;--c:#131c31;--t:#e5e7eb;--m:#94a3b8;--b:#25314d;--a:#818cf8;--s:#070b16}}
:root[data-theme=dark]{--bg:#0b1120;--c:#131c31;--t:#e5e7eb;--m:#94a3b8;--b:#25314d;--a:#818cf8;--s:#070b16}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;min-height:100vh}aside{width:220px;background:var(--s);color:#cbd5e1;padding:16px 10px;flex:none}
aside h1{font-size:18px;color:#fff;margin:0 8px 16px}aside button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit}
aside button:hover,aside button.on{background:#1e293b;color:#fff}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--a);outline-offset:2px}
main{flex:1;min-width:0;padding:18px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
h2{margin:0;font-size:20px}h3{margin:0 0 8px;font-size:14px}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:12px}
.k{font-size:24px;font-weight:700}.mu{color:var(--m);font-size:12px}
input,select,textarea,.btn{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:8px;padding:7px 10px}textarea{width:100%;min-height:70px}
.btn{cursor:pointer}.btn.p{background:var(--a);color:#fff;border-color:var(--a)}.btn.sm{padding:3px 8px;font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--b);white-space:nowrap}th{color:var(--m);font-size:12px}tr.r{cursor:pointer}tr.r:hover{background:var(--bg)}
.bd{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--b);font-weight:600}
.Critical{background:#fee2e2;color:#991b1b}.High{background:#ffedd5;color:#9a3412}.Medium{background:#fef9c3;color:#854d0e}.Low{background:#dcfce7;color:#166534}.Breached{background:#fee2e2;color:#991b1b}.At\ risk{background:#ffedd5;color:#9a3412}.Met,.On\ track{background:#dcfce7;color:#166534}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.br{display:flex;align-items:center;gap:8px;margin:4px 0}.br i{display:block;height:10px;background:var(--a);border-radius:5px}.br span:first-child{width:110px;flex:none}
.ban{background:#fef3c7;color:#78350f;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}.int{border-left:3px solid #f59e0b;padding-left:8px}.e{text-align:center;color:var(--m);padding:24px}
label{display:block;margin:8px 0 3px;font-size:12px;color:var(--m)}form input,form select{width:100%}
@media(max-width:800px){#app{flex-direction:column}aside{width:100%;display:flex;overflow-x:auto;gap:4px;padding:8px}aside h1{margin:6px 10px;white-space:nowrap}aside button{width:auto;white-space:nowrap}}
</style></head><body><div id="app"></div>
<script>
const U=[{id:'e1',n:'Asha Menon',r:'employee'},{id:'e2',n:'Ravi Kumar',r:'employee'},{id:'t1',n:'Meena Iyer',r:'tech',sk:['Network','Security'],cap:5},{id:'t2',n:'Karthik S',r:'tech',sk:['Hardware','Printer'],cap:5},{id:'t3',n:'Dev Patel',r:'tech',sk:['Software','Account Access'],cap:5},{id:'a1',n:'Priya Nair',r:'admin'}];
const CATS=['Hardware','Software','Network','Account Access','Security','Printer','Other'],PR=['Critical','High','Medium','Low'],SLA={Critical:4,High:8,Medium:24,Low:72};
const ST=['Open','Assigned','In Progress','On Hold','Resolved','Closed'],NEXT={Open:['Assigned'],Assigned:['In Progress'],'In Progress':['On Hold','Resolved'],'On Hold':['In Progress'],Resolved:['Closed','Open'],Closed:[]};
const KB=[['Laptop startup problems','Hardware','Hold power 15s, remove charger, reconnect and retry. Check battery LED. If no display, try an external monitor.'],['Wi-Fi connectivity','Network','Toggle Wi-Fi, forget and rejoin the network, restart the device, then test another location.'],['VPN connection errors','Network','Confirm internet works, update the VPN client, re-enter credentials, and check the error code (809 = firewall/UDP blocked).'],['Password and account lockouts','Account Access','Wait 15 minutes, then use self-service reset. Locked repeatedly? Raise a ticket.'],['Expired software licences','Software','Note the product and expiry date and request renewal through a ticket.'],['Printer connectivity','Printer','Check the printer is online, restart the print spooler, and re-add the printer.']];
const KW={Network:['wifi','wi-fi','network','vpn','internet','router'],Hardware:['laptop','boot','screen','monitor','keyboard','battery'],Software:['licence','license','install','excel','crash','software'],'Account Access':['password','locked','login','account','access'],Security:['phish','virus','malware','breach','hack'],Printer:['printer','print','toner']};
const H=36e5;
function seed(){const now=Date.now(),d=[['Laptop will not boot','Hardware','High','In Progress','e1','t2',5],['Office Wi-Fi down on floor 2','Network','Critical','In Progress','e2','t1',3],['VPN error 809','Network','Medium','Assigned','e1','t1',20],['Account locked after reset','Account Access','High','Resolved','e2','t3',30],['Adobe licence expired','Software','Medium','Open','e1',null,6],['Printer offline 3rd floor','Printer','Low','Open','e2',null,2],['Phishing email reported','Security','Critical','Open','e1',null,1],['Excel crashes on launch','Software','Medium','Resolved','e2','t3',60],['Monitor flickering','Hardware','Low','Closed','e1','t2',100],['Cannot access shared drive','Account Access','High','On Hold','e2','t3',26],['Keyboard keys stuck','Hardware','Low','Open','e1',null,30]];
return d.map((x,i)=>{const c=now-x[6]*H,t={id:'T'+i,n:'RIT-'+(1001+i),title:x[0],desc:'Sample (demo) ticket: '+x[0],cat:x[1],pri:x[2],st:x[3],req:x[4],tech:x[5],at:c,dl:c+SLA[x[2]]*H,upd:c,hist:[[c,'Created (Open)']],com:[]};
if(x[5])t.hist.push([c+H/4,'Assigned to '+U.find(u=>u.id==x[5]).n]);if(x[3]=='Resolved'||x[3]=='Closed'){t.res=c+Math.min(x[6]-1,10+i)*H;t.sum='Fixed by technician (demo data).';t.hist.push([t.res,'Resolved'])}return t})}
let S=null,me='e1',v='dash',sel=null,q='',fs='',fp='',srt='new',pg=0,mine='';
try{S=JSON.parse(localStorage.getItem('rit1'))}catch(e){}if(!S)S={t:seed(),n:[]};
const save=()=>{try{localStorage.setItem('rit1',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),usr=id=>U.find(u=>u.id==id),cu=()=>usr(me);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{const h=(Date.now()-t)/H;return h<1?Math.round(h*60)+'m ago':h<48?Math.round(h)+'h ago':Math.round(h/24)+'d ago'};
const done=t=>t.st=='Resolved'||t.st=='Closed',open=t=>!done(t);
const sla=t=>t.res?(t.res<=t.dl?'Met':'Breached'):Date.now()>t.dl?'Breached':(t.dl-Date.now())<(t.dl-t.at)*.25?'At risk':'On track';
const note=(to,msg)=>{S.n.push({to,msg,at:Date.now(),r:0})},admins=()=>U.filter(u=>u.r=='admin').forEach;
const noteAdmin=m=>U.filter(u=>u.r=='admin').forEach(a=>note(a.id,m));
const scope=()=>{const u=cu();return S.t.filter(t=>u.r=='admin'||(u.r=='tech'?t.tech==u.id:t.req==u.id))};
const load=id=>S.t.filter(t=>t.tech==id&&open(t)).length;
const bd=x=>`<span class="bd ${esc(x)}">${{Critical:'⚠ ',High:'▲ ',Breached:'⏰ ','At risk':'◔ ',Met:'✓ ','On track':'✓ '}[x]||''}${esc(x)}</span>`;
function suggest(txt,imp,n){txt=txt.toLowerCase();let best='Other',bs=0;for(const c in KW){const s=KW[c].filter(k=>txt.includes(k)).length;if(s>bs){bs=s;best=c}}
const i=PR.indexOf(imp),a=(3-i)*2,b=n>=50?3:n>=10?2:n>1?1:0,s=best=='Security'?2:0,k=/down|outage|cannot|can't|urgent|not working/.test(txt)?1:0,p=a+b+s+k;
return{cat:best,pri:p>=8?'Critical':p>=5?'High':p>=2?'Medium':'Low',why:`impact +${a}, users +${b}, security +${s}, urgency words +${k} = ${p}`}}
function rec(cat){return U.filter(u=>u.r=='tech'&&u.sk.includes(cat)&&load(u.id)<u.cap).sort((a,b)=>load(a.id)-load(b.id))[0]}
function bars(t,o){const m=Math.max(1,...Object.values(o));return `<div class="card"><h3>${t}</h3>${Object.entries(o).map(([k,x])=>`<div class="br"><span>${esc(k)}</span><i style="width:${x/m*55}%"></i><span>${x}</span></div>`).join('')}</div>`}
function cnts(T,f,keys){const o={};keys.forEach(k=>o[k]=0);T.forEach(t=>{const k=f(t);if(k in o)o[k]++});return o}
function dash(){const T=scope(),u=cu(),c=f=>T.filter(f).length;
if(!T.length)return `<div class="card e">No tickets yet.${u.r=='employee'?' Create your first ticket from “New Ticket”.':''}</div>`;
const K=[['Total',T.length],['Open',c(t=>t.st=='Open')],['In progress',c(t=>t.st=='In Progress')],['Resolved',c(done)]];
if(u.r!='employee'){K.push(['Unassigned',c(t=>!t.tech&&open(t))],['Critical',c(t=>t.pri=='Critical'&&open(t))],['Overdue',c(t=>open(t)&&sla(t)=='Breached')])}
if(u.r=='admin'){const d=T.filter(t=>t.res),m=T.filter(t=>t.res||sla(t)=='Breached');K.push(['Avg resolution',d.length?(d.reduce((a,t)=>a+t.res-t.at,0)/d.length/H).toFixed(1)+'h':'—'],['SLA compliance',m.length?Math.round(100*m.filter(t=>sla(t)=='Met').length/m.length)+'%':'—'])}
let h=`<div class="g">${K.map(k=>`<div class="card"><div class="mu">${k[0]}</div><div class="k">${k[1]}</div></div>`).join('')}</div>`;
if(u.r=='admin')h+=`<div class="g2">${bars('By category',cnts(T,t=>t.cat,CATS))}${bars('By priority',cnts(T,t=>t.pri,PR))}${bars('By status',cnts(T,t=>t.st,ST))}${bars('Technician workload (active)',Object.fromEntries(U.filter(x=>x.r=='tech').map(x=>[x.n,load(x.id)])))}</div>`;
const att=T.filter(t=>open(t)&&(t.pri=='Critical'||sla(t)=='Breached'||(!t.tech&&u.r=='admin')));
if(u.r!='employee')h+=`<div class="card" style="margin-bottom:12px"><h3>Needs attention (critical, overdue, unassigned)</h3>${att.length?tbl(att):'<div class="e">Nothing urgent 🎉</div>'}</div>`;
return h+`<div class="card"><h3>Recent activity</h3>${tbl([...T].sort((a,b)=>b.upd-a.upd).slice(0,5))}</div>`}
function tbl(T){return `<div class="tw"><table><tr><th>ID</th><th>Title</th><th>Employee</th><th>Category</th><th>Priority</th><th>Status</th><th>Technician</th><th>SLA</th><th>Updated</th></tr>${T.map(t=>`<tr class="r" tabindex="0" onclick="go('${t.id}')" onkeydown="if(event.key=='Enter')go('${t.id}')"><td>${t.n}</td><td>${esc(t.title)}</td><td>${esc(usr(t.req).n)}</td><td>${t.cat}</td><td>${bd(t.pri)}</td><td>${t.st}</td><td>${t.tech?esc(usr(t.tech).n):'<b>Unassigned</b>'}</td><td>${bd(sla(t))}</td><td>${ago(t.upd)}</td></tr>`).join('')}</table></div>`}
function list(){let T=scope().filter(t=>(!q||(t.n+t.title+usr(t.req).n).toLowerCase().includes(q.toLowerCase()))&&(!fs||t.st==fs)&&(!fp||t.pri==fp));
T.sort(srt=='old'?(a,b)=>a.at-b.at:srt=='pri'?(a,b)=>PR.indexOf(a.pri)-PR.indexOf(b.pri):srt=='sla'?(a,b)=>a.dl-b.dl:(a,b)=>b.at-a.at);
const pp=8,pages=Math.max(1,Math.ceil(T.length/pp));pg=Math.min(pg,pages-1);
return `<div class="row"><input placeholder="Search ID, title, employee" value="${esc(q)}" oninput="q=this.value;pg=0;R('list')" aria-label="Search"><select onchange="fs=this.value;pg=0;R()" aria-label="Status"><option value="">All statuses</option>${ST.map(s=>`<option ${fs==s?'selected':''}>${s}</option>`)}</select><select onchange="fp=this.value;pg=0;R()" aria-label="Priority"><option value="">All priorities</option>${PR.map(s=>`<option ${fp==s?'selected':''}>${s}</option>`)}</select><select onchange="srt=this.value;R()" aria-label="Sort">${[['new','Newest'],['old','Oldest'],['pri','Priority'],['sla','SLA deadline']].map(s=>`<option value="${s[0]}" ${srt==s[0]?'selected':''}>${s[1]}</option>`)}</select>${cu().r=='admin'?'<button class="btn" onclick="csv()">Copy CSV</button>':''}</div><div class="card">${T.length?tbl(T.slice(pg*pp,pg*pp+pp)):'<div class="e">No tickets match.</div>'}</div><div class="row" style="margin-top:10px"><button class="btn" ${pg?'':'disabled'} onclick="pg--;R()">Prev</button><span class="mu">Page ${pg+1} / ${pages}</span><button class="btn" ${pg<pages-1?'':'disabled'} onclick="pg++;R()">Next</button></div>`}
function csv(){const r=[['ticket','title','category','priority','status','employee','technician','created','sla_deadline']].concat(scope().map(t=>[t.n,t.title,t.cat,t.pri,t.st,usr(t.req).n,t.tech?usr(t.tech).n:'',new Date(t.at).toISOString(),new Date(t.dl).toISOString()]));
const s=r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');try{navigator.clipboard.writeText(s);alert('CSV copied to clipboard')}catch(e){alert(s)}}
function go(id){sel=id;v='tk';R()}
function detail(){const t=S.t.find(x=>x.id==sel),u=cu();if(!t||(u.r=='employee'&&t.req!=u.id)||(u.r=='tech'&&t.tech!=u.id))return '<div class="card e">Ticket not found or access denied.</div>';
const staff=u.r!='employee',canSt=u.r=='admin'||(u.r=='tech'&&t.tech==u.id),acts=NEXT[t.st].filter(s=>staff?(canSt&&!(t.st=='Resolved'&&s=='Open')):t.st=='Resolved'),r=rec(t.cat);
return `<button class="btn sm" onclick="v='list';R()">← Back</button><div class="g2" style="margin-top:10px"><div class="card"><h2>${t.n}: ${esc(t.title)}</h2><p>${esc(t.desc)}</p><div class="row">${bd(t.pri)}<span class="bd">${t.st}</span>${bd(sla(t))}<span class="mu">Deadline ${new Date(t.dl).toLocaleString()}</span></div><p class="mu">Employee: ${esc(usr(t.req).n)} · Category: ${t.cat} · Technician: ${t.tech?esc(usr(t.tech).n):'Unassigned'}</p>${t.sum?`<p><b>Resolution:</b> ${esc(t.sum)}</p>`:''}
<div class="row">${acts.map(s=>`<button class="btn p" onclick="setSt('${t.id}','${s}')">${t.st=='Resolved'&&s=='Open'?'Reopen':'Mark '+s}</button>`).join('')}</div>
${u.r=='admin'?`<div class="row"><select id="as" aria-label="Technician">${U.filter(x=>x.r=='tech').map(x=>`<option value="${x.id}" ${(t.tech||r&&r.id)==x.id?'selected':''}>${esc(x.n)} (${load(x.id)}/${x.cap})</option>`)}</select><button class="btn" onclick="assign('${t.id}',$('#as').value)">Assign</button></div><div class="mu">AI-style suggestion (rule-based): ${r?esc(r.n)+' — matches '+t.cat+', lowest load':'no available skilled technician'}</div>`:''}</div>
<div class="card"><h3>History</h3>${t.hist.map(h=>`<div class="mu">${new Date(h[0]).toLocaleString()} — ${esc(h[1])}</div>`).join('')}</div></div>
<div class="card"><h3>Comments</h3>${t.com.filter(c=>!c.i||staff).map(c=>`<p class="${c.i?'int':''}"><b>${esc(usr(c.by).n)}</b>${c.i?' <span class="bd">Internal note</span>':''} <span class="mu">${ago(c.at)}</span><br>${esc(c.x)}</p>`).join('')||'<div class="mu">No comments yet.</div>'}<textarea id="cm" placeholder="Write a comment" aria-label="Comment"></textarea><div class="row">${staff?'<label style="margin:0"><input type="checkbox" id="ci"> Internal note (staff only)</label>':''}<button class="btn p" onclick="addC('${t.id}')">Post</button></div></div>`}
function chg(t,msg,to){t.upd=Date.now();t.hist.push([t.upd,msg]);(to||[]).forEach(x=>x&&note(x,t.n+': '+msg));save();R()}
function setSt(id,s){const t=S.t.find(x=>x.id==id);if(!NEXT[t.st].includes(s))return;let n=null;
if(s=='Resolved'){n=prompt('Resolution summary (visible to employee):');if(!n)return;t.sum=n;t.res=Date.now()}if(s=='On Hold'&&!(n=prompt('Reason for hold:')))return;
if(s=='Open'){t.tech=null;delete t.res;delete t.sum}t.st=s;chg(t,'Status → '+s+(n&&s=='On Hold'?' ('+n+')':''),[t.req,t.tech]);if(s=='Open')noteAdmin(t.n+' reopened')}
function assign(id,tid){const t=S.t.find(x=>x.id==id);t.tech=tid;if(t.st=='Open')t.st='Assigned';chg(t,'Assigned to '+usr(tid).n,[t.req,tid])}
function addC(id){const t=S.t.find(x=>x.id==id),x=$('#cm').value.trim();if(!x)return;const i=!!($('#ci')&&$('#ci').checked);t.com.push({by:me,x,i,at:Date.now()});
if(!t.first&&cu().r!='employee'){t.first=Date.now()}chg(t,i?'Internal note added':'Comment added',i?[]:[t.req==me?t.tech:t.req])}
function nw(){const c=CATS.map(x=>`<option>${x}</option>`).join('');return `<div class="g2"><form class="card" onsubmit="event.preventDefault();create()"><h3>New ticket</h3><label>Title</label><input id="ti" required maxlength="100" oninput="sg()"><label>Description</label><textarea id="de" required maxlength="2000" oninput="sg()"></textarea><label>Business impact</label><select id="im" onchange="sg()"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select><label>Users affected</label><input id="us" type="number" min="1" value="1" oninput="sg()"><label>Category</label><select id="ca">${c}</select><label>Priority</label><select id="pr">${PR.map(x=>`<option>${x}</option>`)}</select><div class="mu" id="sg" style="margin:8px 0"></div><button class="btn p">Submit ticket</button></form><div class="card"><h3>Suggested articles</h3><div id="kb" class="mu">Start typing to see matching articles. You can submit regardless.</div></div></div>`}
function sg(){const x=$('#ti').value+' '+$('#de').value,s=suggest(x,$('#im').value,+$('#us').value||1);$('#ca').value=s.cat;$('#pr').value=s.pri;
$('#sg').textContent='AI-style suggestion (rule-based, not ML): '+s.cat+' / '+s.pri+' — '+s.why+'. You can override.';const k=KB.filter(a=>a[1]==s.cat);$('#kb').innerHTML=k.length&&x.trim()?k.map(a=>`<p><b>${a[0]}</b><br>${a[2]}</p>`).join(''):'No matching article — just submit your ticket.'}
function create(){const ti=$('#ti').value.trim(),p=$('#pr').value;if(!ti||!$('#de').value.trim())return;if(S.t.some(t=>t.req==me&&t.title==ti&&Date.now()-t.at<6e4)){alert('Duplicate ticket detected.');return}
const c=Date.now(),t={id:'T'+c,n:'RIT-'+(1001+S.t.length),title:ti,desc:$('#de').value.trim(),cat:$('#ca').value,pri:p,st:'Open',req:me,tech:null,at:c,dl:c+SLA[p]*H,upd:c,hist:[[c,'Created (Open)']],com:[]};S.t.push(t);
note(me,t.n+' created');noteAdmin(t.n+' new ticket'+(p=='Critical'?' — CRITICAL':''));save();sel=t.id;v='tk';R()}
function techs(){return `<div class="card tw"><table><tr><th>Technician</th><th>Skills</th><th>Active</th><th>Overdue</th><th>Resolved</th><th>Avg resolution</th><th>Capacity</th></tr>${U.filter(u=>u.r=='tech').map(u=>{const T=S.t.filter(t=>t.tech==u.id),d=T.filter(t=>t.res);return `<tr><td>${esc(u.n)}</td><td>${u.sk.join(', ')}</td><td>${load(u.id)}</td><td>${T.filter(t=>open(t)&&sla(t)=='Breached').length}</td><td>${d.length}</td><td>${d.length?(d.reduce((a,t)=>a+t.res-t.at,0)/d.length/H).toFixed(1)+'h':'—'}</td><td>${u.cap}</td></tr>`}).join('')}</table></div>`}
function kb(){return KB.map(a=>`<div class="card" style="margin-bottom:10px"><h3>${a[0]} <span class="bd">${a[1]}</span></h3><div>${a[2]}</div></div>`).join('')}
